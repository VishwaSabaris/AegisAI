name: AegisAI CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: aegisai
          POSTGRES_PASSWORD: aegisai_dev_password
          POSTGRES_DB: aegisai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisai -d aegisai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1

      - name: Initialize database
        env:
          AEGISAI_DATABASE_URL: postgresql+psycopg://aegisai:aegisai_dev_password@localhost:5432/aegisai
        run: |
          python - <<'PY'
          import psycopg

          connection = psycopg.connect(
              "postgresql://aegisai:aegisai_dev_password@localhost:5432/aegisai"
          )

          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "CREATE EXTENSION IF NOT EXISTS vector;"
                  )
              connection.commit()
          finally:
              connection.close()
          PY

          python -m backend.app.db.init_db

      - name: Seed CI test user
        env:
          AEGISAI_DATABASE_URL: postgresql+psycopg://aegisai:aegisai_dev_password@localhost:5432/aegisai
          AEGISAI_JWT_SECRET: ci-test-secret
        run: |
          python - <<'PY'
          from backend.app.core.database import SessionLocal
          from backend.app.db.models import UserRecord
          from backend.app.security.password import hash_password

          db = SessionLocal()

          try:
              user = UserRecord(
                  id=1,
                  username="testadmin",
                  email="testadmin@aegisai.local",
                  password_hash=hash_password("ci-test-password"),
                  role="admin",
                  is_active=True,
              )

              db.add(user)
              db.commit()

              print("CI test user created successfully.")
          finally:
              db.close()
          PY

      - name: Run backend tests
        env:
          AEGISAI_JWT_SECRET: ci-test-secret
          AEGISAI_DATABASE_URL: postgresql+psycopg://aegisai:aegisai_dev_password@localhost:5432/aegisai
          AEGISAI_CELERY_BROKER_URL: redis://localhost:6379/0
          AEGISAI_CELERY_RESULT_BACKEND: redis://localhost:6379/1
          AEGISAI_OLLAMA_URL: http://localhost:11434/api/chat
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest -q backend/tests -m "not e2e"
